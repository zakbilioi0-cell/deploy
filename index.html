<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Code</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
        }

        .card {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #4c1d95;
        }

        .code-box {
            background: #111827;
            color: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .copy-btn {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6d28d9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #5b21b6;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #16a34a;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="title">
            Salin kode ini 👇
        </div>

        <div class="code-box">
            <pre id="code">&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
    &lt;title&gt;My Website&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;Hello World&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
        </div>

        <button class="copy-btn" onclick="copyCode()">
            📋 Salin Kode
        </button>

        <div class="status" id="status"></div>

    </div>

    <script>
        function copyCode() {

            const code = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>
    <h1>Hello World</h1>
</body>
</html>`;

            navigator.clipboard.writeText(code)
                .then(() => {
                    document.getElementById("status").textContent =
                        "✓ Kode berhasil disalin!";
                })
                .catch(() => {
                    document.getElementById("status").textContent =
                        "❌ Gagal menyalin kode.";
                });
        }
    </script>

</body>
</html>
